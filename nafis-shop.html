<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>فروشگاه بهداشتی نفیس</title>
<style>
:root{--teal:#0f4c5c;--gold:#c6a667;--ink:#16323b;--muted:#5b6d73}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:linear-gradient(180deg,#f7f1e8,#eef6f4);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:rgba(15,76,92,.96);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 18px}
.brand{font-weight:700}
.brand small{display:block;color:#e7d7a8;font-weight:400}
nav a{color:#fff;text-decoration:none;margin-right:12px}
.cart-btn{background:var(--gold);border:0;color:#16323b;padding:8px 12px;border-radius:999px;cursor:pointer;font-weight:700}
.hero{padding:42px 18px 28px;max-width:1100px;margin:auto}
.hero-card{background:#0f4c5c;color:#fff;border-radius:24px;padding:28px}
.hero h1{margin:0 0 8px;font-size:32px}
.hero p{color:#dbe7ea;line-height:1.9}
.wrap{max-width:1100px;margin:auto;padding:0 18px 40px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 16px}
.filters button{border:1px solid #d7c7a2;background:#fff;border-radius:999px;padding:8px 12px;cursor:pointer}
.filters button.active{background:var(--teal);color:#fff;border-color:var(--teal)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border:1px solid #eadfca;border-radius:18px;padding:14px;display:flex;flex-direction:column}
.emoji{height:86px;display:flex;align-items:center;justify-content:center;font-size:42px;background:#f3efe4;border-radius:14px}
.card h3{margin:10px 0 4px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:13px;min-height:38px}
.price{margin:10px 0;color:var(--teal);font-weight:700}
.card button{margin-top:auto;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:10px;cursor:pointer}
.panel{position:fixed;inset:0 auto 0 0;width:min(420px,100%);background:#fff;box-shadow:-8px 0 30px #0002;transform:translateX(-110%);transition:.25s;z-index:30;display:flex;flex-direction:column}
.panel.open{transform:none}
.panel header{position:static}
.panel .body{padding:14px;overflow:auto;flex:1}
.item{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #eee;padding:10px 0}
.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#eee;cursor:pointer}
form{display:grid;gap:8px;margin-top:12px}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px;font-family:inherit}
.submit{background:var(--gold);border:0;padding:12px;border-radius:12px;font-weight:700;cursor:pointer}
.note{font-size:12px;color:var(--muted)}
footer{background:var(--teal);color:#e7d7a8;padding:22px;text-align:center}
.overlay{position:fixed;inset:0;background:#0005;display:none;z-index:25}
.overlay.show{display:block}
</style>
</head>
<body>
<header>
  <div class="brand">نفیس<small>Nafis Care</small></div>
  <nav>
    <a href="#products">محصولات</a>
    <a href="#order">سفارش</a>
  </nav>
  <button class="cart-btn" onclick="toggleCart()">سبد <span id="cartCount">0</span></button>
</header>
<section class="hero">
  <div class="hero-card">
    <h1>فروشگاه بهداشتی نفیس</h1>
    <p>مراقبت پوست، مو و بهداشت روزمره. سفارش با واتساپ به شماره ۰۹۰۳۰۸۷۶۹۵۵ ارسال می‌شود.</p>
  </div>
</section>
<main class="wrap" id="products">
  <h2>محصولات</h2>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
</main>
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<aside class="panel" id="panel">
  <header>
    <div class="brand">سبد خرید</div>
    <button class="cart-btn" onclick="toggleCart()">بستن</button>
  </header>
  <div class="body">
    <div id="cartItems"></div>
    <p><b>جمع:</b> <span id="total">0</span> تومان</p>
    <form id="order" onsubmit="submitOrder(event)">
      <input required name="name" placeholder="نام و نام خانوادگی"/>
      <input required name="phone" placeholder="شماره موبایل خریدار"/>
      <input required name="city" placeholder="شهر"/>
      <textarea required name="address" rows="3" placeholder="آدرس کامل"></textarea>
      <textarea name="note" rows="2" placeholder="توضیح سفارش (اختیاری)"></textarea>
      <button class="submit" type="submit">ثبت سفارش و ارسال واتساپ</button>
      <p class="note">سفارش به واتساپ ۰۹۰۳۰۸۷۶۹۵۵ فرستاده می‌شود.</p>
    </form>
  </div>
</aside>
<footer>فروشگاه نفیس — سفارش‌ها به ۰۹۰۳۰۸۷۶۹۵۵</footer>
<script>
const OWNER_WHATSAPP = "989030876955";
const products = [
  {id:1,cat:"دست و بدن",name:"مایع دستشویی گیاهی",desc:"شوینده ملایم برای مصرف روزانه",price:89000,emoji:"🧼"},
  {id:2,cat:"مو",name:"شامپو ملایم روزانه",desc:"مناسب مصرف روزمره خانواده",price:145000,emoji:"🧴"},
  {id:3,cat:"دهان و دندان",name:"خمیر دندان گیاهی",desc:"حمایت از لثه و تازگی نفس",price:79000,emoji:"🪥"},
  {id:4,cat:"دهان و دندان",name:"دهان‌شویه گیاهی",desc:"بدون الکل برای طراوت همیشگی",price:98000,emoji:"💧"},
  {id:5,cat:"پوست",name:"کرم مرطوب‌کننده روزانه",desc:"آبرسانی مناسب پوست عادی",price:189000,emoji:"🌿"},
  {id:6,cat:"پوست",name:"لوسیون ضدآفتاب",desc:"مراقبت در برابر آفتاب",price:215000,emoji:"☀️"},
  {id:7,cat:"پوست",name:"شوینده صورت ملایم",desc:"پاک‌کننده نرم بدون خشکی زیاد",price:129000,emoji:"🫧"},
  {id:8,cat:"کودک",name:"شامپو بچه ملایم",desc:"فرمول نرم مناسب پوست حساس",price:165000,emoji:"🧸"}
];
let cart = JSON.parse(localStorage.getItem("nafisCart")||"[]");
let filter = "همه";
function save(){localStorage.setItem("nafisCart",JSON.stringify(cart));render();}
function add(id){const p=products.find(x=>x.id===id);const row=cart.find(x=>x.id===id);if(row) row.qty++; else cart.push({id:p.id,name:p.name,price:p.price,qty:1});save();toggleCart(true);}
function changeQty(id,d){cart=cart.map(x=>x.id===id?Object.assign({},x,{qty:x.qty+d}):x).filter(x=>x.qty>0);save();}
function money(n){return n.toLocaleString("fa-IR")}
function render(){
  const cats=["همه"].concat(Array.from(new Set(products.map(p=>p.cat))));
  document.getElementById("filters").innerHTML=cats.map(c=>'<button class="'+(c===filter?'active':'')+'" onclick="filter=\''+c+'\';render()">'+c+'</button>').join('');
  const list=products.filter(p=>filter==="همه"||p.cat===filter);
  document.getElementById("grid").innerHTML=list.map(p=>'<article class="card"><div class="emoji">'+p.emoji+'</div><h3>'+p.name+'</h3><p>'+p.desc+'</p><div class="price">'+money(p.price)+' تومان</div><button onclick="add('+p.id+')">افزودن به سبد</button></article>').join('');
  document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
  document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>'<div class="item"><div><b>'+x.name+'</b><div>'+money(x.price)+' × '+x.qty+'</div></div><div class="qty"><button onclick="changeQty('+x.id+',-1)">-</button> '+x.qty+' <button onclick="changeQty('+x.id+',1)">+</button></div></div>').join(''):'<p>سبد خالی است.</p>';
  document.getElementById("total").textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0));
}
function toggleCart(force){const open=force===true?true:force===false?false:!document.getElementById("panel").classList.contains("open");document.getElementById("panel").classList.toggle("open",open);document.getElementById("overlay").classList.toggle("show",open);}
function submitOrder(e){e.preventDefault();if(!cart.length){alert("اول محصولی به سبد اضافه کن.");return;}const f=e.target;const lines=cart.map(x=>"- "+x.name+" × "+x.qty+" = "+money(x.price*x.qty)+" تومان");const text="سفارش جدید فروشگاه نفیس\nنام: "+f.name.value+"\nموبایل خریدار: "+f.phone.value+"\nشهر: "+f.city.value+"\nآدرس: "+f.address.value+"\n\nمحصولات:\n"+lines.join("\n")+"\n\nجمع: "+document.getElementById("total").textContent+" تومان\nتوضیح: "+(f.note.value||"-");window.open("https://wa.me/"+OWNER_WHATSAPP+"?text="+encodeURIComponent(text),"_blank");}
render();
</script>
</body>
</html>
